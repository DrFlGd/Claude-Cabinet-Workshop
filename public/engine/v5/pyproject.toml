[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-organization"
version = "5.3.0"
description = "OpenSCAD cabinetry and equipment stand engine with a validated Python boundary"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.1,<2", "shapely>=2,<3", "jsonschema>=4.18,<5"]

[project.scripts]
modular-organization = "modular_organization.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modular_organization = ["data/scad/*.scad", "data/scad/*.json", "data/scad/core/*.scad", "data/config/*.json"]
