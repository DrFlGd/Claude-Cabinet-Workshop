name: Import fixed source and deploy

on:
  push:
    branches: [main]
    paths:
      - Cabinet-Workshop-v5-Fixed-Source.zip
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cabinet-workshop-import-deploy
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    outputs:
      imported: ${{ steps.import.outputs.imported }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and import fixed source
        id: import
        shell: bash
        run: |
          set -euo pipefail
          archive="Cabinet-Workshop-v5-Fixed-Source.zip"
          expected="2899b7c0a14bd2b35ad24a62deaa0e18d773c56fe17c9cc8bbd3c80343cdaf28"

          if [[ ! -f "$archive" ]]; then
            echo "::error::Upload $archive to the repository root before running this workflow."
            exit 1
          fi

          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Source ZIP checksum mismatch. Expected $expected, got $actual."
            exit 1
          fi

          rm -rf .source-import
          mkdir .source-import
          unzip -q "$archive" -d .source-import
          test -f .source-import/source/package.json
          test -f .source-import/source/web-dist/index.html

          # Overlay the verified source package without deleting repository-only
          # documentation/workflows such as PACKAGE-COMPARISON.md.
          rsync -a .source-import/source/ ./
          rm -rf .source-import "$archive"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import Cabinet Workshop v5 Fixed source [skip ci]"
            git push
          fi
          echo "imported=true" >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-dist
          cp -a web-dist pages-dist
          python - <<'PY'
          from pathlib import Path
          import os

          repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          base = "/" + repo
          root = Path("pages-dist")

          replacements = [
              ('"/assets/', f'"{base}/assets/'),
              ("'/assets/", f"'{base}/assets/"),
              ('"/openscad/', f'"{base}/openscad/'),
              ("'/openscad/", f"'{base}/openscad/"),
              ('"/engine/', f'"{base}/engine/'),
              ("'/engine/", f"'{base}/engine/"),
              ('"/favicon.svg', f'"{base}/favicon.svg'),
              ("'/favicon.svg", f"'{base}/favicon.svg"),
          ]

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".js", ".css"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          (root / ".nojekyll").write_text("", encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    needs: import-source
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
