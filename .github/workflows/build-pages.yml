name: Build and Pages
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built site to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cabinet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit --incremental false
      - name: Install native geometry test dependency
        run: sudo apt-get update && sudo apt-get install -y openscad zip
      - run: pnpm run test:release
      # Portable release build: relative base path, so the folder can be served from any URL path.
      - run: pnpm run build:static
        env:
          CABINET_BASE_PATH: ./
      - name: Package the portable web build
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          (cd web-dist && zip -qr "../release/claude-cabinet-workshop-web-v$version.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release/
      # GitHub Pages build for this repository's project URL.
      - run: pnpm run build:static
        env:
          CABINET_BASE_PATH: /Claude-Cabinet-Workshop/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag the verified application version
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$(cat VERSION)" = "$version"
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "Version v$version already released; preserving its tag."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$version" -m "Claude Cabinet Workshop v$version"
          git push origin "refs/tags/v$version"
          echo "created=true" >> "$GITHUB_OUTPUT"
  # Only a version that was just tagged gets a release; older tags are left alone.
  release:
    if: needs.version.outputs.created == 'true'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: release
      - name: Publish the GitHub release for the tagged version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving it unchanged."
            exit 0
          fi
          # Release notes are the changelog section for this version.
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "v$version" release/*.zip \
            --title "Claude Cabinet Workshop v$version" \
            --notes-file release-notes.md \
            --verify-tag
